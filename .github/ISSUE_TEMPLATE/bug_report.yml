name: SDK bug report
description: Report a reproducible problem with the JavaScript SDK.
title: '[SDK] '
body:
  - type: markdown
    attributes:
      value: |
        Include fictional inputs and redacted logs. Do not include API keys,
        webhook secrets, phone numbers or customer payloads.
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: '@tyxter/sdk-js 0.8.0'
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include expected behavior and the observed result.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include error.code, request_id or trace_id if available.
